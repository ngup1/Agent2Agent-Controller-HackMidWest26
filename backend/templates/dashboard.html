{% extends "base.html" %}
{% block page %}home{% endblock %}
{% block content %}
<div id="board-content">{% include "board.html" %}</div>
<p id="refresh-status" class="muted" role="status" aria-live="polite">Latest 100 calls. Refreshes every 5 seconds. A call with no outcome leaves the in-progress column after 10 minutes without activity.</p>
{% endblock %}
{% block scripts %}<script>
(() => {
  const target = document.getElementById("board-content");
  const status = document.getElementById("refresh-status");
  async function refresh() {
    try {
      const response = await fetch("/dashboard/board", {
        credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(10000)
      });
      if (response.status === 401 || response.status === 403) {
        target.textContent = "Sign-in required. Reload this page to authenticate.";
        status.textContent = "Refresh stopped."; return;
      }
      if (!response.ok) throw new Error("unavailable");
      // Only escaped, same-origin Jinja markup is inserted.
      const markup = await response.text();
      if (!target.contains(document.activeElement)) target.innerHTML = markup;
      status.textContent = "Checked at " + new Date().toLocaleTimeString() + " (your local time). Refreshes every 5 seconds.";
    } catch {
      status.textContent = "Refresh failed, so the requests shown may be out of date. Retrying in 5 seconds.";
    }
    setTimeout(refresh, 5000);
  }
  setTimeout(refresh, 5000);
})();
</script>{% endblock %}
