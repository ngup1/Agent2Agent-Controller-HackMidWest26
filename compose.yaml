services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    build: .
    environment: &app-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://demo:demo@db:5432/demo}
      DEMO_BUSINESS_ID: ${DEMO_BUSINESS_ID:-6a33f197-7784-54dd-84db-f40dce4c8733}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://ws.akamai-workshops.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_SESSION_SECRET: ${CHAT_SESSION_SECRET:-}
      CHAT_MODEL: ${CHAT_MODEL:-hackathon-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hackathon-embedding}
    command: ["sh", "-c", "python -m backend.scripts.init_db && python -m backend.scripts.seed"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  demo-db:
